name: Build Windows App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache dictionary assets and database
        id: dictionary-cache
        uses: actions/cache@v6
        with:
          path: |
            data/raw
            resources/dictionaries
          key: ${{ runner.os }}-dictionary-${{ hashFiles('data/manifest.json', 'data/curriculum/*.json', 'data/fixtures/*.json', 'scripts/*.py') }}

      - name: Build licensed dictionary
        if: steps.dictionary-cache.outputs.cache-hit != 'true'
        run: |
          python scripts/download_datasets.py
          python scripts/build_dictionary.py

      - name: Validate licensed dictionary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'resources/dictionaries/dictionary.db')) {
            throw 'Generated dictionary database is missing; refusing to package.'
          }
          python scripts/validate_dictionary.py --require-production

      - name: Install dependencies
        run: npm ci

      - name: Prepare offline tokenizer dictionary
        run: npm run prepare:tokenizer

      - name: Verify tokenizer assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dict = Join-Path 'resources' 'tokenizer' 'dict'
          foreach ($file in @('base.dat.gz', 'tid.dat.gz', 'unk_pos.dat.gz')) {
            if (-not (Test-Path (Join-Path $dict $file))) {
              throw "Tokenizer dictionary file $file is missing; refusing to package."
            }
          }
          if (-not (Test-Path (Join-Path 'resources' 'notices' 'IPADIC-NOTICE.txt'))) {
            throw 'IPADIC notice is missing; refusing to package.'
          }

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build Windows installer
        run: npm run make -- --arch=x64

      - name: Smoke test packaged app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path 'out' -Filter 'kotoba.exe' -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.DirectoryName -like '*win32-x64*' } |
            Select-Object -First 1
          if (-not $exe) { throw 'Packaged app executable not found under out/*win32-x64*' }

          $proc = Start-Process -FilePath $exe.FullName -ArgumentList '--remote-debugging-port=9222' -PassThru
          $page = $null
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 1
            try {
              $targets = Invoke-RestMethod -Uri 'http://127.0.0.1:9222/json' -TimeoutSec 2
              $candidate = $targets | Where-Object { $_.type -eq 'page' }
              if ($candidate) { $page = $candidate | Select-Object -First 1; break }
            } catch { }
          }

          if (-not $page) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw 'Packaged app did not expose a renderer within 40s'
          }
          if ($page.url -notlike 'file://*') {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Packaged app loaded unexpected URL: $($page.url)"
          }

          Write-Host "Renderer loaded: $($page.url)"
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Kotoba-Windows-x64
          path: out/make/**/*
          retention-days: 7
          if-no-files-found: error

      - name: Upload unpacked app
        uses: actions/upload-artifact@v4
        with:
          name: Kotoba-Windows-x64-unpacked
          path: out/Kotoba-win32-x64/**
          retention-days: 7
          if-no-files-found: error
